<div class="subsection" id="leaderboard">
  <div class="subsection-head">
    <div>
      <h3>Leaderboard</h3>
    </div>
  </div>

  <div class="lbf lbf-bar" data-plot>
    <div class="lbf-scroll"><!--FIG:bar--></div>
    <div class="lb-tip" role="status"></div>
  </div>
  <div class="lbf lbf-pareto" data-plot>
    <div class="lbf-scroll"><!--FIG:pareto--></div>
    <div class="lb-tip" role="status"></div>
    <p class="lbf-cap"><b>Solid:</b> the frontier &mdash; nothing cheaper scores higher. One dot per model, at the effort it was run at. SWE-2&rsquo;s price is the board&rsquo;s estimate of $0.00.</p>
  </div>

  <section data-board="boardData">
    <div class="lb-toolbar">
      <label class="lb-search"><span aria-hidden="true">⌕</span><input type="search" placeholder="Search models" aria-label="Search models"></label>
    </div>
    <div class="lb-facets">
      <span class="k">Family</span><button class="lb-chip" data-facet="family" data-value="Anthropic" aria-pressed="false">Anthropic</button><button class="lb-chip" data-facet="family" data-value="Cognition" aria-pressed="false">Cognition</button><button class="lb-chip" data-facet="family" data-value="DeepSeek" aria-pressed="false">DeepSeek</button><button class="lb-chip" data-facet="family" data-value="Google" aria-pressed="false">Google</button><button class="lb-chip" data-facet="family" data-value="Meta" aria-pressed="false">Meta</button><button class="lb-chip" data-facet="family" data-value="Moonshot AI" aria-pressed="false">Moonshot AI</button><button class="lb-chip" data-facet="family" data-value="OpenAI" aria-pressed="false">OpenAI</button><button class="lb-chip" data-facet="family" data-value="StepFun" aria-pressed="false">StepFun</button><button class="lb-chip" data-facet="family" data-value="Thinking Machines" aria-pressed="false">Thinking Machines</button><button class="lb-chip" data-facet="family" data-value="Undisclosed" aria-pressed="false">Undisclosed</button><button class="lb-chip" data-facet="family" data-value="SpaceXAI" aria-pressed="false">SpaceXAI</button><button class="lb-chip" data-facet="family" data-value="Z.ai" aria-pressed="false">Z.ai</button><span class="k">Effort</span><button class="lb-chip" data-facet="effort" data-value="ultra" aria-pressed="false">ultra</button><button class="lb-chip" data-facet="effort" data-value="max" aria-pressed="false">max</button><button class="lb-chip" data-facet="effort" data-value="xhigh" aria-pressed="false">xhigh</button><button class="lb-chip" data-facet="effort" data-value="high" aria-pressed="false">high</button><button class="lb-chip" data-facet="effort" data-value="thinking" aria-pressed="false">thinking</button><button class="lb-chip" data-facet="effort" data-value="none" aria-pressed="false">not set</button>
      <button class="lb-chip clear" type="button" data-facet-clear>Clear</button>
    </div>
    <div class="table-wrap">
      <table class="lb-board"><thead></thead><tbody></tbody></table>
    </div>
    <div class="lb-empty" hidden>Nothing matches these filters.</div>
    <div class="lb-boardfoot">
      <span class="count"></span>
      <button class="lb-more" type="button" hidden></button>
    </div>
  </section>
</div>
